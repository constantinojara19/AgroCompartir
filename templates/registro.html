{% extends "base.html" %}
{% block contenido %}
<div class="auth-fondo">
    <div class="auth-caja">
        <span class="sello">AC</span>
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Sumate a la cooperativa AgroCompartir</p>

        {% if error %}
        <div class="alerta alerta--error">{{ error }}</div>
        {% endif %}

        <form class="formulario" method="POST">
            <label for="nombre">Nombre y apellido</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <label>¿Cómo vas a usar AgroCompartir?</label>
            <div class="fila-radio">
                <label><input type="radio" name="tipo" value="cliente" checked> Cliente (necesito transportar)</label>
                <label><input type="radio" name="tipo" value="fletero"> Fletero (tengo camión)</label>
            </div>

            <button type="submit" class="btn">Registrarme</button>
        </form>

        <div class="auth-links">
            ¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciá sesión</a>
        </div>
    </div>
</div>
{% endblock %}
